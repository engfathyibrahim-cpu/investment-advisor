name: Update advisor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: advisor-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: advisor-cache-${{ github.run_id }}
          restore-keys: advisor-cache-
      - run: python build.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: advisor-cache-${{ github.run_id }}
      - name: Save the daily top-picks log
        run: |
          git config user.name "advisor-bot"
          git config user.email "advisor-bot@users.noreply.github.com"
          git add history/picks.json
          if git diff --cached --quiet; then echo "No new picks today"; else
            git commit -m "Log daily top picks" && (git pull --rebase && git push || echo "Push skipped")
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
